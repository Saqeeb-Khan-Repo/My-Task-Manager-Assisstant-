
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f6">
<title>My Personal Task Assistant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#eef1f6;
  --card:#fff;
  --tx:#0f1b2d;
  --mu:#5a6679;
  --bd:#dce2ec;
  --ac:#1e3a8a;
  --ok:#15803d;
  --bad:#b91c1c;
  --wn:#b45309;
  --shadow:0 8px 28px rgba(15,27,45,.08);
}

:root[data-theme="dark"] {
  --bg:#0a111d;
  --card:#121b2b;
  --tx:#e8edf6;
  --mu:#93a1b8;
  --bd:#29364b;
  --ac:#8fb2ff;
  --ok:#4ade80;
  --bad:#f87171;
  --wn:#fbbf24;
  --shadow:0 8px 28px rgba(0,0,0,.22);
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--tx);
  font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;
}

button,input,select { font:inherit; }
button { cursor:pointer; touch-action:manipulation; }
button:focus-visible,input:focus-visible,select:focus-visible {
  outline:3px solid var(--ac);
  outline-offset:2px;
}

header {
  position:sticky;
  top:0;
  z-index:5;
  background:var(--card);
  border-bottom:1px solid var(--bd);
  box-shadow:var(--shadow);
  padding:16px 22px;
}

.top {
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}

h1 {
  flex:1;
  margin:0;
  font:600 1.5rem/1.2 Fraunces,Georgia,serif;
}

h1 small {
  display:block;
  margin-top:5px;
  color:var(--mu);
  font:400 .8rem "Plus Jakarta Sans",sans-serif;
}

.btn,.ghost {
  border-radius:11px;
  min-height:44px;
  padding:9px 15px;
  font-weight:600;
}

.btn {
  color:#fff;
  background:var(--ac);
  border:1px solid transparent;
}

.ghost {
  color:var(--tx);
  background:var(--card);
  border:1px solid var(--bd);
}

.btn:hover,.ghost:hover { filter:brightness(1.08); }

.stats {
  max-width:1200px;
  margin:13px auto 0;
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--mu);
  font-size:.82rem;
}

.bar {
  height:8px;
  flex:1;
  overflow:hidden;
  border-radius:10px;
  background:var(--bd);
}

.bar i {
  display:block;
  width:0;
  height:100%;
  background:var(--ok);
  transition:width .3s;
}

main {
  max-width:1200px;
  margin:auto;
  padding:20px 16px;
}

.focus {
  display:flex;
  gap:14px;
  align-items:flex-start;
  padding:18px;
  margin-bottom:18px;
  border:1px solid var(--bd);
  border-radius:18px;
  background:var(--card);
  box-shadow:var(--shadow);
}

.focus-icon {
  display:grid;
  place-items:center;
  width:44px;
  height:44px;
  flex-shrink:0;
  border-radius:13px;
  background:var(--bg);
  font-size:1.35rem;
}

.focus h2 {
  margin:0;
  font:600 1.2rem Fraunces,Georgia,serif;
}

.focus p { margin:5px 0 0; color:var(--mu); }

.chips {
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

.chip {
  padding:4px 10px;
  border:1px solid var(--bd);
  border-radius:999px;
  background:var(--bg);
  font-size:.78rem;
  font-weight:600;
}

.tabs {
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.tab {
  flex:1;
  min-height:43px;
  border:1px solid var(--bd);
  border-radius:12px;
  color:var(--tx);
  background:var(--card);
}

.tab.active {
  color:#fff;
  background:var(--ac);
  border-color:var(--ac);
}

.board {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
  align-items:start;
}

.column {
  min-width:0;
  overflow:hidden;
  border:1px solid var(--bd);
  border-radius:17px;
  background:var(--card);
  box-shadow:var(--shadow);
}

.column h2 {
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  padding:16px;
  border-bottom:1px solid var(--bd);
  font:600 1.08rem Fraunces,Georgia,serif;
}

.count {
  margin-left:auto;
  padding:2px 9px;
  border-radius:99px;
  background:var(--bg);
  font:600 .8rem "Plus Jakarta Sans",sans-serif;
}

.quick {
  display:flex;
  gap:7px;
  padding:12px 12px 0;
}

.quick input { min-width:0; flex:1; }

input,select {
  width:100%;
  min-height:44px;
  padding:10px 12px;
  border:1px solid var(--bd);
  border-radius:10px;
  color:var(--tx);
  background:var(--bg);
}

.list {
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:12px;
  min-height:110px;
}

.task {
  display:flex;
  gap:9px;
  align-items:flex-start;
  padding:13px 10px 13px 12px;
  border:1px solid var(--bd);
  border-left:4px solid var(--bd);
  border-radius:13px;
  background:var(--card);
}

.task.High { border-left-color:#dc2626; }
.task.Medium { border-left-color:#f59e0b; }
.task.Low { border-left-color:#16a34a; }

.task-content { flex:1; min-width:0; }

.task-title {
  font-weight:700;
  overflow-wrap:anywhere;
}

.task.done .task-title {
  text-decoration:line-through;
  color:var(--mu);
  font-weight:400;
}

.meta {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:7px;
}

.badge {
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid var(--bd);
  border-radius:999px;
  background:var(--bg);
  font-size:.72rem;
  font-weight:600;
  overflow-wrap:anywhere;
}

.badge.High { color:#dc2626; }
.badge.Medium { color:var(--wn); }
.badge.Low { color:var(--ok); }

.category-badge {
  border-color:color-mix(in srgb,var(--ac) 35%,var(--bd));
  background:color-mix(in srgb,var(--ac) 10%,var(--card));
  color:var(--tx);
}

.overdue { color:var(--bad); }
.due-soon { color:var(--wn); }

.task-actions {
  display:flex;
  flex-direction:column;
  gap:5px;
}

.icon-btn {
  min-width:34px;
  min-height:34px;
  border:1px solid var(--bd);
  border-radius:8px;
  background:var(--bg);
  color:var(--tx);
}

.icon-btn:hover { background:var(--bd); }

.complete-btn {
  padding:6px 9px;
  border:0;
  border-radius:8px;
  background:var(--ok);
  color:#fff;
  font-size:.75rem;
  font-weight:700;
}

.empty {
  padding:25px 10px;
  border:1px dashed var(--bd);
  border-radius:11px;
  color:var(--mu);
  text-align:center;
  font-size:.85rem;
}

.overlay {
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(0,0,0,.55);
}

.overlay.open { display:flex; }

.modal {
  width:min(460px,100%);
  max-height:90dvh;
  overflow-y:auto;
  padding:23px;
  border:1px solid var(--bd);
  border-radius:20px;
  background:var(--card);
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal h2 {
  margin:0 0 16px;
  font:600 1.45rem Fraunces,Georgia,serif;
}

.field { margin-top:13px; }

.field label {
  display:block;
  margin-bottom:5px;
  color:var(--mu);
  font-size:.85rem;
  font-weight:600;
}

.field select,.field input { display:block; }

.modal-actions {
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
}

.error {
  min-height:1.2em;
  margin:8px 0 0;
  color:var(--bad);
  font-size:.85rem;
}

#toast {
  position:fixed;
  z-index:30;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  max-width:90%;
  padding:11px 18px;
  border-radius:10px;
  background:var(--tx);
  color:var(--bg);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
}

#toast.show { opacity:1; }

.fab {
  display:none;
  position:fixed;
  right:18px;
  bottom:20px;
  z-index:10;
  width:56px;
  height:56px;
  border:0;
  border-radius:50%;
  background:var(--ac);
  color:#fff;
  font-size:1.8rem;
  box-shadow:var(--shadow);
}

@media(max-width:899px) {
  .board { display:block; }
  .column { display:none; }
  .column.active { display:block; }
  .fab { display:block; }
  main { padding:14px 12px; }
  .tabs { display:flex; }
  .list { padding-bottom:18px; }
  .top { gap:8px; }
  h1 { font-size:1.15rem; }
}

@media(min-width:600px) and (max-width:899px) {
  .board { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
  .column { display:block; }
  .column.completed-column { grid-column:1/-1; }
  .tabs,.fab { display:none; }
}

@media(min-width:900px) {
  .tabs { display:none; }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { transition:none!important; }
}
</style>
</head>

<body>
<header>
  <div class="top">
    <h1>
      My Personal Task Assistant
      <small id="date"></small>
    </h1>
    <button class="btn" id="addBtn">+ Add task</button>
    <button class="ghost" id="themeBtn" aria-label="Toggle light and dark theme">🌓</button>
  </div>
  <div class="stats">
    <span id="statsText">0 of 0 done today</span>
    <div class="bar"><i id="progress"></i></div>
  </div>
</header>

<main>
  <section class="focus" aria-live="polite">
    <div class="focus-icon">🎯</div>
    <div>
      <h2>Today's focus</h2>
      <p id="focusText">Choose a task and make progress today.</p>
      <div class="chips" id="focusChips"></div>
    </div>
  </section>

  <nav class="tabs" aria-label="Task columns">
    <button class="tab active" data-tab="today">📅 Today</button>
    <button class="tab" data-tab="pending">⏳ Pending</button>
    <button class="tab" data-tab="completed">✅ Completed</button>
  </nav>

  <div class="board">
    <section class="column active" id="todayColumn">
      <h2>📅 Today's tasks <span class="count" id="todayCount">0</span></h2>
      <div class="quick">
        <input id="quickInput" maxlength="100" placeholder="Quick add a task..." aria-label="Quick add task">
        <button class="btn" id="quickBtn">Add</button>
      </div>
      <div class="list" id="todayList"></div>
    </section>

    <section class="column" id="pendingColumn">
      <h2>⏳ Pending <span class="count" id="pendingCount">0</span></h2>
      <div class="list" id="pendingList"></div>
    </section>

    <section class="column completed-column" id="completedColumn">
      <h2>
        ✅ Completed
        <span class="count" id="completedCount">0</span>
        <button class="ghost" id="clearBtn" style="margin-left:auto;padding:4px 9px;min-height:32px;font-size:.75rem">Clear</button>
      </h2>
      <div class="list" id="completedList"></div>
    </section>
  </div>
</main>

<button class="fab" id="fab" aria-label="Add task">+</button>

<div class="overlay" id="overlay">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Create a task</h2>
    <form id="taskForm">
      <div class="field">
        <label for="taskTitle">Task title *</label>
        <input id="taskTitle" maxlength="100" required autocomplete="off" placeholder="What do you need to do?">
      </div>

      <div class="field">
        <label for="taskPriority">Priority</label>
        <select id="taskPriority">
          <option value="High">🔴 High</option>
          <option value="Medium" selected>🟠 Medium</option>
          <option value="Low">🟢 Low</option>
        </select>
      </div>

      <div class="field">
        <label for="taskCategory">Category *</label>
        <select id="taskCategory">
          <option value="work">💻 Work</option>
          <option value="study" selected>📚 Study</option>
          <option value="islamic">🕌 Islamic</option>
          <option value="health">🏋️ Health</option>
          <option value="personal">👤 Personal</option>
          <option value="shopping">🛒 Shopping</option>
          <option value="other">📌 Other</option>
        </select>
      </div>

      <div class="field">
        <label for="taskDate">Due date</label>
        <input type="date" id="taskDate">
      </div>

      <p class="error" id="formError" role="alert"></p>

      <div class="modal-actions">
        <button type="button" class="ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn" id="saveBtn">Save task</button>
      </div>
    </form>
  </section>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

const TASK_KEY = "tm.tasks";
const THEME_KEY = "tm.theme";

const CATEGORIES = {
  work:     { label: "Work",     icon: "💻" },
  study:    { label: "Study",    icon: "📚" },
  islamic:  { label: "Islamic",  icon: "🕌" },
  health:   { label: "Health",   icon: "🏋️" },
  personal: { label: "Personal", icon: "👤" },
  shopping: { label: "Shopping", icon: "🛒" },
  other:    { label: "Other",    icon: "📌" }
};

const PRIORITIES = { High: 0, Medium: 1, Low: 2 };

const $ = id => document.getElementById(id);

let tasks = loadTasks();
let editingId = null;
let toastTimer = null;

function loadTasks() {
  try {
    const stored = JSON.parse(localStorage.getItem(TASK_KEY) || "[]");
    if (!Array.isArray(stored)) return [];

    return stored
      .filter(t => t && t.id && typeof t.title === "string")
      .map(t => ({
        id: String(t.id),
        title: t.title,
        priority: ["High", "Medium", "Low"].includes(t.priority)
          ? t.priority : "Medium",
        category: CATEGORIES[t.category] ? t.category : "other",
        dueDate: typeof t.dueDate === "string" ? t.dueDate : "",
        done: t.done === true,
        createdAt: Number(t.createdAt) || Date.now(),
        completedAt: Number(t.completedAt) || null
      }));
  } catch (error) {
    console.error("Could not load tasks:", error);
    return [];
  }
}

function saveTasks() {
  try {
    localStorage.setItem(TASK_KEY, JSON.stringify(tasks));
    return true;
  } catch (error) {
    console.error("Could not save tasks:", error);
    showToast("Could not save. Check browser storage.");
    return false;
  }
}

function uid() {
  return window.crypto && crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now() + "-" + Math.random().toString(36).slice(2);
}

function localDate(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function escapeDate(value) {
  if (!value) return "";
  const parts = value.split("-");
  if (parts.length !== 3) return value;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function showToast(message) {
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2300);
}

function findTask(id) {
  return tasks.find(task => task.id === id);
}

function createElement(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function createBadge(text, className = "") {
  return createElement("span", `badge ${className}`.trim(), text);
}

function getCategoryLabel(category) {
  const item = CATEGORIES[category] || CATEGORIES.other;
  return `${item.icon} ${item.label}`;
}

function sortTasks(a, b) {
  return (PRIORITIES[a.priority] ?? 1) -
    (PRIORITIES[b.priority] ?? 1) ||
    (a.dueDate || "9999-99-99").localeCompare(
      b.dueDate || "9999-99-99"
    ) ||
    a.createdAt - b.createdAt;
}

function createTaskCard(task) {
  const card = createElement(
    "article",
    `task ${task.priority}${task.done ? " done" : ""}`
  );

  const content = createElement("div", "task-content");
  const title = createElement("div", "task-title", task.title);
  content.appendChild(title);

  const meta = createElement("div", "meta");
  meta.appendChild(createBadge(task.priority, task.priority));

  const category = CATEGORIES[task.category] || CATEGORIES.other;
  meta.appendChild(
    createBadge(`${category.icon} ${category.label}`, "category-badge")
  );

  if (task.dueDate) {
    const due = createBadge(`📅 ${escapeDate(task.dueDate)}`);

    if (!task.done && task.dueDate < localDate()) {
      due.classList.add("overdue");
      due.textContent = `⚠️ Overdue · ${escapeDate(task.dueDate)}`;
    } else if (!task.done && task.dueDate === localDate()) {
      due.classList.add("due-soon");
      due.textContent = `⏰ Due today`;
    }

    meta.appendChild(due);
  }

  if (task.done) {
    meta.appendChild(createBadge("✅ Completed"));
  }

  content.appendChild(meta);

  const actions = createElement("div", "task-actions");

  const completeBtn = createElement(
    "button",
    "complete-btn",
    task.done ? "Undo" : "Done"
  );
  completeBtn.type = "button";
  completeBtn.setAttribute(
    "aria-label",
    task.done ? "Move task to pending" : "Complete task"
  );
  completeBtn.addEventListener("click", () => toggleTask(task.id));
  actions.appendChild(completeBtn);

  const editBtn = createElement("button", "icon-btn", "✏️");
  editBtn.type = "button";
  editBtn.title = "Edit task";
  editBtn.setAttribute("aria-label", "Edit " + task.title);
  editBtn.addEventListener("click", () => openEditor(task.id));
  actions.appendChild(editBtn);

  const deleteBtn = createElement("button", "icon-btn", "🗑️");
  deleteBtn.type = "button";
  deleteBtn.title = "Delete task";
  deleteBtn.setAttribute("aria-label", "Delete " + task.title);
  deleteBtn.addEventListener("click", () => deleteTask(task.id));
  actions.appendChild(deleteBtn);

  card.append(content, actions);
  return card;
}

function renderList(elementId, items, emptyMessage) {
  const list = $(elementId);
  list.replaceChildren();

  if (!items.length) {
    list.appendChild(createElement("div", "empty", emptyMessage));
    return;
  }

  items.forEach(task => list.appendChild(createTaskCard(task)));
}

function render() {
  const today = localDate();

  const todayTasks = tasks
    .filter(t => !t.done && (!t.dueDate || t.dueDate <= today))
    .sort(sortTasks);

  const pendingTasks = tasks
    .filter(t => !t.done && t.dueDate > today)
    .sort(sortTasks);

  const completedTasks = tasks
    .filter(t => t.done)
    .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));

  renderList("todayList", todayTasks, "No tasks for today. Add your first task!");
  renderList("pendingList", pendingTasks, "No upcoming tasks. You're all caught up!");
  renderList("completedList", completedTasks, "Completed tasks will appear here.");

  $("todayCount").textContent = todayTasks.length;
  $("pendingCount").textContent = pendingTasks.length;
  $("completedCount").textContent = completedTasks.length;

  const completedToday = tasks.filter(t =>
    t.done && t.completedAt &&
    localDate(new Date(t.completedAt)) === today
  ).length;

  const totalToday = todayTasks.length + completedToday;
  $("statsText").textContent = `${completedToday} of ${totalToday} done today`;

  const percent = totalToday
    ? Math.round(completedToday / totalToday * 100)
    : 0;

  $("progress").style.width = `${percent}%`;

  const focusText = $("focusText");
  const focusChips = $("focusChips");
  focusChips.replaceChildren();

  if (todayTasks.length) {
    focusText.textContent = `You have ${todayTasks.length} task${todayTasks.length === 1 ? "" : "s"} to focus on today. Start with your highest-priority task.`;

    todayTasks.slice(0, 3).forEach(task => {
      const chip = createElement(
        "span",
        "chip",
        `${CATEGORIES[task.category]?.icon || "📌"} ${task.title}`
      );
      focusChips.appendChild(chip);
    });
  } else {
    focusText.textContent = "No unfinished tasks due today. Plan ahead or enjoy your progress.";
  }

  $("date").textContent = new Date().toLocaleDateString("en", {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric"
  });
}

function openEditor(id = null) {
  editingId = id;
  $("taskForm").reset();
  $("formError").textContent = "";

  const task = id ? findTask(id) : null;

  $("modalTitle").textContent = task ? "Edit task" : "Create a task";
  $("saveBtn").textContent = task ? "Update task" : "Save task";

  $("taskTitle").value = task ? task.title : "";
  $("taskPriority").value = task ? task.priority : "Medium";
  $("taskCategory").value = task ? task.category : "study";
  $("taskDate").value = task ? task.dueDate : "";

  $("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
  $("taskTitle").focus();
}

function closeEditor() {
  $("overlay").classList.remove("open");
  document.body.style.overflow = "";
  editingId = null;
}

function saveTask(event) {
  event.preventDefault();

  const title = $("taskTitle").value.trim();
  const priority = $("taskPriority").value;
  const category = $("taskCategory").value;
  const dueDate = $("taskDate").value;

  if (!title) {
    $("formError").textContent = "Please enter a task title.";
    $("taskTitle").focus();
    return;
  }

  if (title.length > 100) {
    $("formError").textContent = "Task titles cannot exceed 100 characters.";
    return;
  }

  if (!CATEGORIES[category]) {
    $("formError").textContent = "Please select a valid category.";
    return;
  }

  if (!["High", "Medium", "Low"].includes(priority)) {
    $("formError").textContent = "Please select a valid priority.";
    return;
  }

  const oldTask = editingId ? findTask(editingId) : null;

  const task = {
    id: editingId || uid(),
    title,
    priority,
    category,
    dueDate,
    done: oldTask ? oldTask.done : false,
    createdAt: oldTask ? oldTask.createdAt : Date.now(),
    completedAt: oldTask ? oldTask.completedAt : null
  };

  if (editingId) {
    const index = tasks.findIndex(t => t.id === editingId);
    if (index !== -1) tasks[index] = task;
  } else {
    tasks.push(task);
  }

  if (!saveTasks()) {
    if (oldTask) {
      tasks = tasks.map(t => t.id === oldTask.id ? oldTask : t);
    } else {
      tasks = tasks.filter(t => t.id !== task.id);
    }
    render();
    return;
  }

  closeEditor();
  render();
  showToast(oldTask ? "Task updated successfully" : "Task created successfully");
}

function addQuickTask() {
  const input = $("quickInput");
  const title = input.value.trim();

  if (!title) {
    input.focus();
    showToast("Enter a task title first");
    return;
  }

  const task = {
    id: uid(),
    title: title.slice(0, 100),
    priority: "Medium",
    category: "study",
    dueDate: localDate(),
    done: false,
    createdAt: Date.now(),
    completedAt: null
  };

  tasks.push(task);

  if (!saveTasks()) {
    tasks = tasks.filter(t => t.id !== task.id);
    render();
    return;
  }

  input.value = "";
  render();
  showToast("Study task added");
}

function toggleTask(id) {
  const task = findTask(id);
  if (!task) return;

  const previous = { done: task.done, completedAt: task.completedAt };

  task.done = !task.done;
  task.completedAt = task.done ? Date.now() : null;

  if (!saveTasks()) {
    task.done = previous.done;
    task.completedAt = previous.completedAt;
    render();
    return;
  }

  render();
  showToast(task.done ? "Task completed! 🎉" : "Task moved back to pending");
}

function deleteTask(id) {
  const task = findTask(id);
  if (!task) return;

  if (!confirm(`Delete "${task.title}"?`)) return;

  const previous = tasks;
  tasks = tasks.filter(t => t.id !== id);

  if (!saveTasks()) {
    tasks = previous;
    render();
    return;
  }

  render();
  showToast("Task deleted");
}

function clearCompleted() {
  const completed = tasks.filter(t => t.done);
  if (!completed.length) {
    showToast("No completed tasks to clear");
    return;
  }

  if (!confirm(`Delete all ${completed.length} completed tasks?`)) return;

  const previous = tasks;
  tasks = tasks.filter(t => !t.done);

  if (!saveTasks()) {
    tasks = previous;
    render();
    return;
  }

  render();
  showToast("Completed tasks cleared");
}

function switchTab(tab) {
  const ids = {
    today: "todayColumn",
    pending: "pendingColumn",
    completed: "completedColumn"
  };

  document.querySelectorAll(".tab").forEach(button => {
    button.classList.toggle("active", button.dataset.tab === tab);
  });

  Object.entries(ids).forEach(([key, id]) => {
    $(id).classList.toggle("active", key === tab);
  });
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $("themeBtn").textContent = theme === "dark" ? "☀️" : "🌙";
  $("themeBtn").setAttribute(
    "aria-label",
    theme === "dark" ? "Switch to light theme" : "Switch to dark theme"
  );

  try {
    localStorage.setItem(THEME_KEY, theme);
  } catch (error) {
    console.warn("Theme preference could not be saved.");
  }
}

// Event listeners
$("addBtn").addEventListener("click", () => openEditor());
$("fab").addEventListener("click", () => openEditor());
$("cancelBtn").addEventListener("click", closeEditor);
$("taskForm").addEventListener("submit", saveTask);
$("quickBtn").addEventListener("click", addQuickTask);
$("quickInput").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    addQuickTask();
  }
});
$("clearBtn").addEventListener("click", clearCompleted);

$("themeBtn").addEventListener("click", () => {
  const current = document.documentElement.dataset.theme || "light";
  applyTheme(current === "dark" ? "light" : "dark");
});

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => switchTab(button.dataset.tab));
});

$("overlay").addEventListener("click", event => {
  if (event.target === $("overlay")) closeEditor();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && $("overlay").classList.contains("open")) {
    closeEditor();
  }
});

// Initialize
try {
  const savedTheme = localStorage.getItem(THEME_KEY);
  applyTheme(savedTheme === "dark" ? "dark" : "light");
} catch (error) {
  applyTheme("light");
}

render();
</script>
</body>
</html>
